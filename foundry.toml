[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.35"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1999
bytecode_hash = "none"

# forge-std cheatcodes use `error` as an identifier (solc 6335).
ignored_error_codes = [6335]

[profile.default.fuzz]
runs = 1000
seed = "0x4444"

[fmt]
tab_width = 2
